workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

stages:
  - lint
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

default:
  image: python:3.12
  before_script:
    - apt-get update -y
    - apt-get install -y libgl1 libglib2.0-0 libsm6 libxext6 libxrender1 libgomp1 ffmpeg
    - pip install --upgrade pip
    - pip install -e .
    - pip install pytest ruff
  cache:
    key:
      files:
        - pyproject.toml
    paths:
      - .cache/pip

lint:
  stage: lint
  script:
    - ruff check .

test:clip:
  stage: test
  script:
    - pytest tests/test_clip.py

test:effects:
  stage: test
  script:
    - pytest tests/test_effects.py

test:io:
  stage: test
  script:
    - pytest tests/test_io.py
