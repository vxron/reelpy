workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

stages:
  - lint
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

default:
  image: python:3.12
  before_script:
    - apt-get update -y
    - apt-get install -y libgl1 libglib2.0-0 libsm6 libxext6 libxrender1 libgomp1 ffmpeg
    - pip install --upgrade pip
    - pip install -e .
    - pip install pytest ruff
  cache:
    key:
      files:
        - pyproject.toml
    paths:
      - .cache/pip

lint:
  stage: lint
  script:
    - ruff check .

test:clip:
  stage: test
  script:
    - pytest tests/test_clip.py

test:effects:
  stage: test
  script:
    - pytest tests/test_effects.py

test:io:
  stage: test
  script:
    - pytest tests/test_io.py

test:other:
  stage: test
  script:
    - |
      COLLECTED=$(pytest tests/ --ignore=tests/test_clip.py --ignore=tests/test_effects.py --ignore=tests/test_io.py --collect-only -q | tail -1)
      if echo "$COLLECTED" | grep -qv "no tests collected"; then
        echo "=================================================================="
        echo "WARNING: test:other collected tests outside the named parallel jobs."
        echo "This means a new test_*.py file was added that isn't split into"
        echo "its own dedicated CI job (test:clip, test:effects, test:io)."
        echo "Coverage is NOT lost — these tests are still running right now,"
        echo "in this job, un-parallelized. But you should add a dedicated job"
        echo "for the new file if you want it to run in parallel with the others."
        echo "Collected: $COLLECTED"
        echo "=================================================================="
      fi
    - pytest tests/ --ignore=tests/test_clip.py --ignore=tests/test_effects.py --ignore=tests/test_io.py
